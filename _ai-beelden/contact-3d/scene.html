/* ---- 2. envelop met brief ---- */
function envelop() {
  const g = new THREE.Group(), W = 2.05, H = 1.32;
  const papier = doek(512, 512, (c, w, h) => { c.fillStyle = '#FFFFFF'; c.fillRect(0, 0, w, h); ruis(c, w, h, 9000, .05); });

  const achter = new THREE.Mesh(new THREE.BoxGeometry(W, H, .02), mat('#123780')); achter.position.z = -.03; g.add(achter);

    c.fillStyle = '#C9D0DC'; for (let i = 0; i < 6; i++) { c.beginPath(); c.roundRect(70, 200 + i * 58, w - 140 - (i % 3) * 120, 16, 8); c.fill(); } ruis(c, w, h, 5000, .03); });

  const rechts = new THREE.Mesh(driehoek([[W / 2, -H / 2], [-.03, -.04], [W / 2, H / 2]], .008), zij); rechts.position.z = .002; g.add(rechts);
  const bodem = new THREE.Mesh(driehoek([[-W / 2, -H / 2], [W / 2, -H / 2], [0, .12]], .008), onder); bodem.position.z = .013; g.add(bodem);
  // de open klep, met Koningsblauwe voering aan de binnenkant
  const klep = new THREE.Group(); klep.position.set(0, H / 2, -.02);
  const buiten = new THREE.Mesh(driehoek([[-W / 2, 0], [W / 2, 0], [0, .78]], .008), mat('#1746A2')); buiten.position.z = -.01; klep.add(buiten);

  g.rotation.set(.22, -.55, .1); g.position.y = -.3; g.scale.setScalar(.84);
  return schaduw(g);
}

/* ---- 3. formulier met pen ---- */
function formulier() {
  const g = new THREE.Group(), W = 1.5, H = 2.0;

    ruis(c, w, h, 7000, .03); });
  const wit = new THREE.MeshPhysicalMaterial({ color: '#FBFBF9', roughness: .78 });
  const bord = new THREE.Mesh(new RoundedBoxGeometry(W + .2, H + .24, .05, 5, .04), new THREE.MeshPhysicalMaterial({ color: KONINGSBLAUW, roughness: .45, clearcoat: .5, clearcoatRoughness: .3 })); bord.position.set(0, .04, -.06); g.add(bord);
  const staal = new THREE.MeshPhysicalMaterial({ color: '#DADFE7', metalness: 1, roughness: .2 });
  const klem = new THREE.Mesh(new RoundedBoxGeometry(.72, .2, .07, 4, .03), staal); klem.position.set(0, H / 2 + .06, .03); g.add(klem);
  const oog = new THREE.Mesh(new RoundedBoxGeometry(.34, .2, .05, 4, .025), staal); oog.position.set(0, H / 2 + .17, .01); g.add(oog);
  [[.05, -.03, -.035, -.025], [-.04, .02, .03, -.012]].forEach(([x, y, r, z]) => { const v = new THREE.Mesh(new THREE.BoxGeometry(W, H, .01), wit); v.position.set(x, y, z); v.rotation.z = r; g.add(v); });

  const boven = new THREE.Mesh(geo, new THREE.MeshPhysicalMaterial({ map: blad, roughness: .68, side: THREE.DoubleSide })); boven.position.z = .004; g.add(boven);
  // de pen
  const pen = new THREE.Group();
  const lak = new THREE.MeshPhysicalMaterial({ color: KONINGSBLAUW, roughness: .22, clearcoat: 1, clearcoatRoughness: .1 }), metaal = new THREE.MeshPhysicalMaterial({ color: '#D9DDE4', metalness: 1, roughness: .22 }), geel = new THREE.MeshPhysicalMaterial({ color: GOUDGEEL, roughness: .3, clearcoat: .8 });
  const deel = (geom, m, y) => { const o = new THREE.Mesh(geom, m); o.position.y = y; pen.add(o); return o; };

  deel(new THREE.CylinderGeometry(.053, .053, .2, 32), geel, .62); deel(new THREE.SphereGeometry(.053, 24, 16), geel, .72);
  const clip = deel(new THREE.BoxGeometry(.026, .42, .012), metaal, .46); clip.position.z = .062;
  pen.scale.setScalar(1.3); pen.rotation.set(0, 0, -2.3); pen.position.set(.42, -.62, .16); g.add(pen);
  g.rotation.set(-.3, -.48, .16); g.scale.setScalar(.8); g.position.y = -.05;
  return schaduw(g);
}

/* ---- 4. verhuisdoos met het logo ---- */
async function doos() {
  const g = new THREE.Group(), W = 1.75, H = 1.28, D = 1.3;
  const logo = await laadBeeld('/site/img/logo/dereus-logo.svg');   // het logo in kleur: Koningsblauw met het goudgele huis, zoals op de echte dozen
  const karton = (metLogo, greep) => doek(1024, 760, (c, w, h) => { c.fillStyle = '#C79A63'; c.fillRect(0, 0, w, h);
    const v = c.createLinearGradient(0, 0, 0, h); v.addColorStop(0, 'rgba(255,230,190,.2)'); v.addColorStop(1, 'rgba(90,55,20,.2)'); c.fillStyle = v; c.fillRect(0, 0, w, h);
    c.globalAlpha = .06; c.fillStyle = '#5A3A18'; for (let x = 0; x < w; x += 7) c.fillRect(x, 0, 2, h); c.globalAlpha = 1; ruis(c, w, h, 22000, .08, 255, 70);
    if (metLogo) { const lw = 690, lh = lw * 828 / 1000; c.globalAlpha = .97; c.shadowColor = 'rgba(70,40,10,.6)'; c.shadowBlur = 7; c.shadowOffsetY = 2; c.drawImage(logo, (w - lw) / 2, (h - lh) / 2 + 30, lw, lh); c.shadowColor = 'transparent'; c.globalAlpha = 1; }   // gewoon eroverheen: met multiply wordt blauw bijna zwart en geel bruin
    if (greep) { c.fillStyle = '#3A2611'; c.beginPath(); c.roundRect(w / 2 - 120, 150, 240, 74, 37); c.fill(); c.fillStyle = 'rgba(0,0,0,.35)'; c.beginPath(); c.roundRect(w / 2 - 120, 150, 240, 26, 13); c.fill(); } });
  const kant = (t) => new THREE.MeshPhysicalMaterial({ map: t, roughness: .88, sheen: .25 });
  const bovenkant = doek(1024, 760, (c, w, h) => { c.fillStyle = '#CFA36C'; c.fillRect(0, 0, w, h); c.globalAlpha = .06; c.fillStyle = '#5A3A18'; for (let x = 0; x < w; x += 7) c.fillRect(x, 0, 2, h); c.globalAlpha = 1; ruis(c, w, h, 22000, .08, 255, 70);
    c.fillStyle = 'rgba(60,35,10,.55)'; c.fillRect(0, h / 2 - 3, w, 6); });
  const lijf = new THREE.Mesh(new RoundedBoxGeometry(W, H, D, 4, .025), [kant(karton(false, true)), kant(karton(false, true)), kant(bovenkant), kant(karton(false, false)), kant(karton(true, false)), kant(karton(false, false))]); g.add(lijf);

  g.rotation.set(.46, -.66, 0); g.scale.setScalar(.8); g.position.y = -.05;
  return schaduw(g);
}

  const obj = await ({ telefoon, envelop, formulier, doos })[naam](); scene.add(obj);
  renderer.render(scene, camera);
  return renderer.domElement.toDataURL('image/png');
};
