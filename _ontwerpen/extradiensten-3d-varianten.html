<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Extra diensten op /kosten/ · 10 ontwerpen</title>
<link rel="stylesheet" href="/css/min/site.min.css">
<style>
/* /kosten/ blok extradiensten (opslag, verhuislift, montage, woningontruiming): tien opzetten met 3D-voorwerpen
   (three.js-renders met het echte logo, bron _ai-beelden/kosten-3d), in de taal van "Gele schijven" hierboven op de
   pagina. Teksten en links letterlijk die van de pagina. Licht linksboven, alles staat stil. */
:root{
  --rand-wit:#D5E2F8; --rand-blauw:#071838; --rand-geel:#DB940E;
  --val-midden:0 14px 26px -14px rgba(14,26,51,.30); --val-ver:0 46px 80px -46px rgba(11,35,82,.5);
  --plaat:inset 0 1px 0 #fff,0 0 0 1px rgba(14,26,51,.05),0 7px 0 var(--rand-wit),0 8px 0 rgba(14,26,51,.08),var(--val-midden),var(--val-ver);
  --plaat-blauw:inset 0 1px 0 rgba(255,255,255,.18),0 7px 0 var(--rand-blauw),var(--val-midden),var(--val-ver);
  --obj-schaduw:drop-shadow(3px 4px 2px rgba(11,35,82,.28)) drop-shadow(14px 20px 16px rgba(11,35,82,.34));
  --schijf:linear-gradient(180deg,#FFDD6B,var(--brand-accent));
}
html{scroll-padding-top:4.5rem}
*,*::before,*::after{animation:none!important;transition:none!important}
.onav{position:sticky;top:0;z-index:50;background:var(--brand-secondary);color:#fff;box-shadow:0 6px 18px -8px rgba(5,14,35,.6)}
.onav .wrap{display:flex;align-items:center;gap:.35rem .5rem;flex-wrap:wrap;padding-block:.6rem}
.onav strong{font:800 1.05rem/1 var(--font-display);font-stretch:condensed;margin-right:auto}
.onav a{display:grid;place-items:center;min-width:2.3rem;height:2.3rem;border-radius:999px;background:rgba(255,255,255,.1);color:#fff;text-decoration:none;font:700 .9rem/1 var(--font-sans)}
.onav a:hover{background:var(--brand-accent);color:var(--brand-secondary)}
.okop{background:var(--ink);color:#fff}
.okop .wrap{display:flex;flex-wrap:wrap;align-items:baseline;gap:.3rem 1.2rem;padding-block:.9rem}
.okop b{font:800 1.5rem/1 var(--font-display);font-stretch:condensed;color:var(--brand-accent)}
.okop span{font:700 1.15rem/1.2 var(--font-display);font-stretch:condensed}
.okop small{flex:1 1 24rem;color:rgba(255,255,255,.72);font-size:.9rem}

.v{position:relative;padding-block:clamp(3.5rem,2.5rem + 3vw,5.5rem);background:var(--off-white);overflow:clip}
.k h2{margin:0;color:var(--brand-primary);font:800 clamp(1.45rem,1.25rem + .7vw,1.8rem)/1.15 var(--font-display);font-stretch:condensed;text-wrap:balance}
.k p{margin:0;color:var(--ink);font-size:1rem;line-height:1.6}
.meer{display:inline-flex;align-items:center;gap:.5rem;min-height:48px;padding:.55rem 1.2rem;border-radius:12px;background:var(--primary-50);color:var(--brand-primary);font:700 1rem/1.2 var(--font-sans);text-decoration:none;
  box-shadow:inset 0 0 0 1px var(--primary-200),0 4px 0 var(--rand-wit),0 12px 16px -12px rgba(11,35,82,.4)}
.meer::after{content:"→";font-size:1.1em}
.meer:hover{background:var(--brand-primary);color:#fff;box-shadow:inset 0 0 0 1px var(--brand-primary),0 4px 0 var(--brand-secondary)}
.obj{display:block;max-width:none;object-fit:contain;object-position:50% 100%;filter:var(--obj-schaduw);pointer-events:none}
.pod{position:relative;display:grid;justify-items:center;align-items:end}
.pod::before{content:"";position:absolute;left:50%;bottom:-.6rem;width:12rem;max-width:94%;height:3.7rem;border-radius:50%;transform:translateX(-50%);background:var(--schijf);box-shadow:0 9px 0 var(--rand-geel),0 28px 26px -10px rgba(11,35,82,.4)}
.pod .obj{position:relative;width:100%;margin-bottom:.9rem}
.r2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(1.5rem,2.4vw,2.25rem);margin:0;padding:0;list-style:none}
.r4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(1rem,1.6vw,1.5rem);margin:0;padding:0;list-style:none}

/* ===== 1. GELE SCHIJVEN 2x2: geen kaarten, voorwerp op een schijf links, tekst rechts ===== */
.e1 .r2{gap:3.2rem clamp(2rem,4vw,4rem)}
.e1 .k{display:grid;grid-template-columns:13.5rem minmax(0,1fr);gap:0 1.8rem;align-items:center}
.e1 .pod{grid-row:1 / span 3;height:13rem;margin-bottom:.8rem} .e1 .pod .obj{height:11.8rem}
.e1 .k h2{align-self:end;margin-bottom:.6rem} .e1 .k p{margin-bottom:1.1rem} .e1 .meer{justify-self:start;align-self:start}

/* ===== 2. GELE SCHIJVEN OP EEN RIJ: zoals de prijsfactoren hierboven ===== */
.e2 .r4{gap:0}
.e2 .k{display:flex;flex-direction:column;align-items:center;gap:.7rem;padding:0 1.2rem;text-align:center}
.e2 .pod{width:100%;height:13.5rem;margin-bottom:1rem} .e2 .pod .obj{height:12rem}
.e2 .k+.k{border-left:1px solid var(--grey-300)}
.e2 .meer{margin-top:auto} .e2 .k p{margin-bottom:.5rem}

/* ===== 3. WITTE PLATEN: geel logohuis, het voorwerp breekt rechtsboven uit de kaart ===== */
.e3 .r2{padding-top:3.4rem;row-gap:5rem}
.e3 .k{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:.8rem;padding:2rem 13.5rem 2rem 2rem;border-radius:24px;background:#fff;box-shadow:var(--plaat)}
.e3 .huis,.e3 .huis2{position:absolute;right:2.2rem;top:1.4rem;width:8.4rem;aspect-ratio:535.3/509.8;-webkit-mask:var(--huisvlak) center/contain no-repeat;mask:var(--huisvlak) center/contain no-repeat}
.e3 .huis{background:var(--brand-accent)} .e3 .huis2{transform:translate(6px,7px);background:var(--rand-geel)}
.e3 .obj{position:absolute;right:.4rem;bottom:calc(100% - 9.8rem);width:12.5rem;height:14rem;object-position:100% 100%}
.e3 .k::before{content:"";position:absolute;left:2rem;top:0;width:4.25rem;height:5px;border-radius:0 0 5px 5px;background:var(--brand-accent)}

/* ===== 4. BLAUW PODIUM LINKS: liggende kaart, het voorwerp steekt boven het podium uit ===== */
.e4 .r2{padding-top:2.6rem;row-gap:4.4rem}
.e4 .k{position:relative;display:grid;grid-template-columns:38% minmax(0,1fr);border-radius:24px;background:#fff;box-shadow:var(--plaat)}
.e4 .podium{position:relative;border-radius:24px 0 0 24px;background:radial-gradient(9rem 3.4rem at 50% 86%,rgba(158,190,248,.6),transparent 70%),linear-gradient(160deg,#1E51B5,var(--brand-secondary))}
.e4 .obj{position:absolute;left:4%;bottom:1.1rem;width:92%;height:calc(100% + 1.6rem)}
.e4 .tekst{display:flex;flex-direction:column;align-items:flex-start;gap:.8rem;padding:1.8rem 1.8rem 1.9rem}

/* ===== 5. DONKER PANEEL: één Diepblauwe plaat, vier spots, voorwerpen over de rand ===== */
.e5 .paneel{position:relative;isolation:isolate;margin-top:4.5rem;padding:0 clamp(1rem,2vw,1.8rem) 2.4rem;border-radius:28px;background:var(--brand-secondary);box-shadow:var(--plaat-blauw)}
.e5 .paneel::after{content:"";position:absolute;z-index:-1;inset:0;border-radius:28px;background:
  radial-gradient(8rem 9rem at 12.5% 3.8rem,rgba(74,125,226,.55),transparent 70%),radial-gradient(8rem 9rem at 37.5% 3.8rem,rgba(74,125,226,.55),transparent 70%),radial-gradient(8rem 9rem at 62.5% 3.8rem,rgba(74,125,226,.55),transparent 70%),radial-gradient(8rem 9rem at 87.5% 3.8rem,rgba(74,125,226,.55),transparent 70%)}
.e5 .r4{gap:0}
.e5 .k{display:flex;flex-direction:column;align-items:flex-start;gap:.75rem;padding:0 1.4rem} .e5 .meer{margin-top:auto} .e5 .k p{margin-bottom:.5rem}
.e5 .k+.k{border-left:1px solid rgba(255,255,255,.16)}
.e5 .obj{width:100%;height:12rem;margin:-4.4rem 0 .6rem;filter:drop-shadow(3px 4px 2px rgba(0,0,0,.35)) drop-shadow(14px 22px 18px rgba(0,0,0,.5))}
.e5 .k h2{color:#fff} .e5 .k p{color:rgba(255,255,255,.86)}
.e5 .meer{background:var(--brand-accent);color:var(--brand-secondary);box-shadow:0 4px 0 var(--rand-geel)}

/* ===== 6. BLAUWVERLOOP: vier kaarten van wit naar Diepblauw, voorwerp bovenop ===== */
.e6 .r4{padding-top:4.4rem}
.e6 .k{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:.75rem;padding:8.4rem 1.5rem 1.8rem;border-radius:24px}
.e6 .obj{position:absolute;left:8%;bottom:calc(100% - 7.6rem);width:84%;height:12rem}
.e6 .k:nth-child(1){background:#fff;box-shadow:var(--plaat)}
.e6 .k:nth-child(2){background:var(--primary-200);box-shadow:0 7px 0 #A9C4F3,var(--val-midden),var(--val-ver)}
.e6 .k:nth-child(3){background:var(--brand-primary);box-shadow:0 7px 0 #0F3078,var(--val-midden),var(--val-ver)}
.e6 .k:nth-child(4){background:var(--brand-secondary);box-shadow:var(--plaat-blauw)}
.e6 .k:nth-child(n+3) h2{color:#fff} .e6 .k:nth-child(n+3) p{color:rgba(255,255,255,.88)}
.e6 .k:nth-child(n+3) .meer{background:var(--brand-accent);color:var(--brand-secondary);box-shadow:0 4px 0 var(--rand-geel)}
.e6 .meer{margin-top:auto}

/* ===== 7. OM EN OM: vier brede rijen, groot voorwerp afwisselend links en rechts ===== */
.e7 .lijst{display:grid;gap:0;margin:0;padding:0;list-style:none}
.e7 .k{display:grid;grid-template-columns:minmax(0,22rem) minmax(0,1fr);gap:0 clamp(2rem,5vw,5rem);align-items:center;padding:2.6rem 0}
.e7 .k+.k{border-top:1px solid var(--grey-300)}
.e7 .k:nth-child(even){grid-template-columns:minmax(0,1fr) minmax(0,22rem)} .e7 .k:nth-child(even) .pod{order:2}
.e7 .pod{height:16rem} .e7 .pod .obj{height:14.6rem} .e7 .pod::before{width:17rem;height:5rem}
.e7 .tekst{display:flex;flex-direction:column;align-items:flex-start;gap:1rem;max-width:40rem}
.e7 .k h2{font-size:var(--text-h2)}
.e7 .k p{font-size:1.125rem}

/* ===== 8. MOZAIEK: één grote Diepblauwe tegel, drie witte ernaast ===== */
.e8 .rooster{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);grid-template-rows:repeat(3,auto);gap:1.6rem 1.5rem;margin:0;padding:2.6rem 0 0;list-style:none}
.e8 .k{position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:.7rem;padding:1.6rem 12rem 1.7rem 1.8rem;border-radius:24px;background:#fff;box-shadow:var(--plaat)}
.e8 .k .obj{position:absolute;right:1rem;bottom:1.2rem;width:10rem;height:calc(100% + 1.4rem)}
.e8 .k:nth-child(1){grid-row:1 / span 3;justify-content:flex-end;padding:1.9rem;background:radial-gradient(24rem 15rem at 50% 36%,#1E51B5,transparent 70%),var(--brand-secondary);box-shadow:var(--plaat-blauw)}
.e8 .k:nth-child(1) .obj{right:auto;left:4%;top:-2.6rem;bottom:auto;width:92%;height:19rem}
.e8 .k:nth-child(1) h2{color:#fff;font-size:var(--text-h2)} .e8 .k:nth-child(1) p{color:rgba(255,255,255,.88)}
.e8 .k:nth-child(1) .meer{background:var(--brand-accent);color:var(--brand-secondary);box-shadow:0 4px 0 var(--rand-geel)}

/* ===== 9. FOTO EN VOORWERP: de echte foto blijft, het voorwerp staat ervoor en komt uit de foto ===== */
.e9 .k{position:relative;display:grid;grid-template-rows:auto 1fr auto;border-radius:22px;background:#fff;box-shadow:var(--plaat)}
.e9 .foto{position:relative;height:15rem;border-radius:22px 22px 0 0;overflow:hidden;background:var(--brand-secondary)}
.e9 .foto img{width:100%;height:100%;object-fit:cover;object-position:50% 35%}
.e9 .foto::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,35,82,.05) 30%,rgba(11,35,82,.9))}
.e9 .k h2{position:absolute;left:1.8rem;right:13rem;top:15rem;transform:translateY(calc(-100% - 1.1rem));color:#fff}
.e9 .obj{position:absolute;right:1.2rem;top:6.4rem;width:11.5rem;height:12rem;filter:drop-shadow(3px 4px 2px rgba(0,0,0,.35)) drop-shadow(14px 20px 16px rgba(5,14,35,.5))}
.e9 .k p{padding:2rem 13rem 0 1.8rem} .e9 .meer{justify-self:start;margin:1.3rem 1.8rem 1.8rem}

/* ===== 10. PLANK: vier voorwerpen op één dikke witte plank, de antwoorden eronder ===== */
.e10 .plank{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-items:end;padding:0 1rem}
.e10 .plank::after{content:"";position:absolute;left:0;right:0;bottom:-1.5rem;height:1.5rem;border-radius:12px;background:linear-gradient(180deg,#fff,#EEF3FC);box-shadow:0 8px 0 var(--rand-wit),0 9px 0 rgba(14,26,51,.1),0 30px 40px -18px rgba(11,35,82,.5)}
.e10 .plek{position:relative;display:grid;justify-items:center;height:14rem;align-items:end}
.e10 .plek::before{content:"";position:absolute;left:14%;right:6%;bottom:-.5rem;height:1.4rem;background:radial-gradient(closest-side,rgba(11,35,82,.35),transparent);filter:blur(3px)}
.e10 .plek .obj{position:relative;width:88%;height:13rem;filter:drop-shadow(2px 3px 2px rgba(11,35,82,.25))}
.e10 .r4{gap:0;margin-top:4.2rem;padding:0 1rem}
.e10 .k{display:flex;flex-direction:column;align-items:flex-start;gap:.75rem;padding:0 1.3rem} .e10 .meer{margin-top:auto} .e10 .k p{margin-bottom:.5rem}
.e10 .k+.k{border-left:1px solid var(--grey-300)}

@media(max-width:1000px){
  .r4{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:3rem} .r2,.e8 .rooster{grid-template-columns:minmax(0,1fr)}
  .e2 .k+.k,.e5 .k+.k,.e10 .k+.k{border-left:0} .e5 .r4{row-gap:5.5rem} .e6 .r4{row-gap:5.5rem}
  .e7 .k,.e7 .k:nth-child(even){grid-template-columns:minmax(0,1fr)} .e7 .k:nth-child(even) .pod{order:0}
  .e8 .k:nth-child(1){grid-row:auto;padding-top:17rem} .e10 .plank{display:none} .e10 .r4{margin-top:0}
}
@media(max-width:640px){
  .r4{grid-template-columns:minmax(0,1fr)}
  .e1 .k{grid-template-columns:minmax(0,1fr)} .e1 .pod{grid-row:auto}
  .e3 .k{padding:9rem 1.5rem 1.6rem} .e3 .obj{right:auto;left:1rem;width:11rem;height:11rem;bottom:calc(100% - 8rem)} .e3 .huis,.e3 .huis2{right:auto;left:6.5rem;top:1.2rem;width:5.6rem}
  .e4 .k{grid-template-columns:minmax(0,1fr)} .e4 .podium{height:10rem;border-radius:24px 24px 0 0}
  .e8 .k{padding:1.5rem} .e8 .k:not(:nth-child(1)) .obj{position:relative;right:auto;bottom:auto;width:9rem;height:9rem}
  .e9 .k h2{right:1.8rem} .e9 .obj{width:7.5rem;height:8rem;top:1rem} .e9 .k p{padding-right:1.8rem}
}
</style>
</head>
<body>
<nav class="onav" aria-label="Ontwerpen"><div class="wrap"><strong>Extra diensten · 10 ontwerpen</strong><span id="onav"></span></div></nav>
<main id="main"></main>
<script>
const E = [
  { t: 'Wat kost opslag van uw inboedel?', p: 'De kosten van opslag van uw inboedel hangen af van hoeveel u opslaat en hoe lang. Omdat wij de verhuizing en de opslag samen regelen, staat alles in één offerte.', l: 'Meer over tijdelijke opslag', h: '/diensten/#opslag', o: 'opslagopen', w: 569, b: 'dienst-opslag' },
  { t: 'Wat kost verhuizen met een verhuislift?', p: 'Of een verhuislift nodig is, en wat dat kost, hangt af van de verdieping en de plek voor uw woning. Uw verhuisadviseur bekijkt het samen met u en neemt het mee in de offerte.', l: 'Meer over verhuizen met de verhuislift', h: '/diensten/#verhuislift', o: 'lift', w: 210, b: 'dienst-verhuislift' },
  { t: 'Wat kost montage bij een verhuizing?', p: 'Demonteren en weer opbouwen kost tijd. Hoeveel, hangt af van het aantal meubels en hoe ingewikkeld ze zijn. Noem in uw aanvraag wat er uit elkaar moet, dan staat het in de offerte.', l: 'Meer over de handymanservice', h: '/diensten/#montage', o: 'boor', w: 509, b: 'dienst-handyman' },
  { t: 'Wat kost een woningontruiming?', p: 'Wat een woningontruiming kost, hangt af van de grootte van de woning, hoeveel er in staat en wat er met de spullen moet gebeuren. Uw verhuisadviseur bespreekt het rustig met u, en u krijgt vooraf een offerte.', l: 'Meer over woningontruiming', h: '/diensten/#woningontruiming', o: 'huis', w: 425, b: 'dienst-woningontruiming' },
];
const obj = e => `<img class="obj" src="/img/kosten-3d/${e.o}.webp" alt="" width="${e.w}" height="420" loading="lazy" decoding="async">`;
const pod = e => `<span class="pod" aria-hidden="true">${obj(e)}</span>`;
const kop = e => `<h2>${e.t}</h2>`, tekst = e => `<p>${e.p}</p>`, meer = e => `<a class="meer" href="${e.h}">${e.l}</a>`;
const alles = e => kop(e) + tekst(e) + meer(e);
const lijst = (klas, fn) => `<ul class="${klas}" role="list">${E.map(e => `<li class="k">${fn(e)}</li>`).join('')}</ul>`;

const V = [
  { naam: 'Gele schijven 2×2', uitleg: 'Yukarıda seçtiğin "Gele schijven" dilinin devamı: kart yok, nesne solda sarı diskte, soru ve cevap sağda.',
    html: () => lijst('r2', e => pod(e) + alles(e)) },
  { naam: 'Gele schijven op een rij', uitleg: 'Dört nesne yan yana sarı disklerde, metin ortalı, aralarında ince çizgi. Fiyat faktörleriyle birebir aynı ritim.',
    html: () => lijst('r4', e => pod(e) + alles(e)) },
  { naam: 'Witte platen', uitleg: '/contact/ kartlarının dili: kalın beyaz levha, arkada sarı logo evi, nesne sağ üstten kartın dışına taşıyor.',
    html: () => lijst('r2', e => `<span class="huis2"></span><span class="huis"></span>${obj(e)}${alles(e)}`) },
  { naam: 'Blauw podium links', uitleg: 'Yatay kart: solda ışıklı mavi podyum, nesne podyumun üstünden dışarı çıkıyor; sağda soru, cevap ve link.',
    html: () => lijst('r2', e => `<div class="podium" aria-hidden="true">${obj(e)}</div><div class="tekst">${alles(e)}</div>`) },
  { naam: 'Donker paneel', uitleg: 'Tek Diepblauw levha, dört spot ışığı, nesneler üst kenardan taşıyor; linkler sarı buton.',
    html: () => `<div class="paneel">${lijst('r4', e => obj(e) + alles(e))}</div>` },
  { naam: 'Blauwverloop', uitleg: 'Beyazdan Diepblauw\'a koyulaşan dört kart, nesne kartın üstünde duruyor. Sayfadaki basamak kartlarıyla aynı renk dili.',
    html: () => lijst('r4', e => obj(e) + alles(e)) },
  { naam: 'Om en om', uitleg: 'Dört geniş satır, dev nesne bir solda bir sağda, büyük başlık. En ferah ve en "dergi" görünümlü.',
    html: () => lijst('lijst', e => `${pod(e)}<div class="tekst">${alles(e)}</div>`) },
  { naam: 'Mozaïek', uitleg: 'Dev depoyla büyük Diepblauw karo, yanında üç beyaz yatay karo; nesneler karoların kenarından taşıyor.',
    html: () => lijst('rooster', e => obj(e) + alles(e)) },
  { naam: 'Foto en voorwerp', uitleg: 'Şimdiki gerçek fotoğraflar kalıyor, 3D nesne fotoğrafın önünde durup beyaz alana taşıyor. Gerçek + 3D birlikte.',
    html: () => lijst('r2', e => `<div class="foto"><img src="/img/${e.b}.webp" alt="" loading="lazy" decoding="async"></div>${kop(e)}${obj(e)}${tekst(e)}${meer(e)}`) },
  { naam: 'Plank', uitleg: 'Dört nesne tek kalın beyaz rafta, sorular ve cevaplar hemen altında dört sütun.',
    html: () => `<div class="plank" aria-hidden="true">${E.map(e => `<div class="plek">${obj(e)}</div>`).join('')}</div>` + lijst('r4', alles) },
];
const twee = i => String(i + 1).padStart(2, '0');
document.getElementById('onav').outerHTML = V.map((v, i) => `<a href="#e${i + 1}" title="${v.naam}">${i + 1}</a>`).join('');
document.getElementById('main').innerHTML = V.map((v, i) => `
  <div class="okop" id="e${i + 1}"><div class="wrap"><b>${twee(i)}</b><span>${v.naam}</span><small>${v.uitleg}</small></div></div>
  <section class="v e${i + 1}"><div class="wrap">${v.html()}</div></section>`).join('');
</script>
</body>
</html>
